
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Review - ServiceHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_review.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Service<span>Hub</span>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('services') }}">
            Services
        </a>

        <a href="{{ url_for('my_bookings') }}">
            My Bookings
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<main class="review-container">

    <div class="review-card">

        <div class="review-header">

            <p class="small-title">
                SERVICEHUB
            </p>

            <h1>
                Rate Your Service
            </h1>

            <p>
                Share your experience with this service.
            </p>

        </div>


        <div class="service-info">

            <span class="category">
                {{ booking.service.category }}
            </span>

            <h2>
                {{ booking.service.name }}
            </h2>

            <p>
                Booking #{{ booking.id }}
            </p>

        </div>


        <form method="POST"
              action="{{ url_for('add_review', booking_id=booking.id) }}">


            <div class="form-group">

                <label>
                    Your Rating
                </label>

                <div class="rating-options">

                    <label>
                        <input type="radio"
                               name="rating"
                               value="1"
                               required>
                        <span>★</span>
                        1
                    </label>

                    <label>
                        <input type="radio"
                               name="rating"
                               value="2">
                        <span>★★</span>
                        2
                    </label>

                    <label>
                        <input type="radio"
                               name="rating"
                               value="3">
                        <span>★★★</span>
                        3
                    </label>

                    <label>
                        <input type="radio"
                               name="rating"
                               value="4">
                        <span>★★★★</span>
                        4
                    </label>

                    <label>
                        <input type="radio"
                               name="rating"
                               value="5">
                        <span>★★★★★</span>
                        5
                    </label>

                </div>

            </div>


            <div class="form-group">

                <label for="comment">
                    Your Review
                </label>

                <textarea
                    id="comment"
                    name="comment"
                    rows="6"
                    placeholder="Tell us about your experience..."></textarea>

            </div>


            <button type="submit"
                    class="submit-button">

                Submit Review

            </button>


            <a href="{{ url_for('my_bookings') }}"
               class="back-button">

                Back to My Bookings

            </a>

        </form>

    </div>

</main>


<footer>

    © 2026 ServiceHub. All Rights Reserved.

</footer>

</body>

</html>

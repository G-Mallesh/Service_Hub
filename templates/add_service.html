<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Service - ServiceHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_service.css') }}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Service<span>Hub</span>
    </div>

    <nav>

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('worker_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

</header>


<main class="page">

    <div class="service-card">

        <div class="card-header">

            <h1>Add Service</h1>

            <p>
                Add a service that you provide to customers.
            </p>

        </div>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="flash-box">

                    {% for message in messages %}

                        <p>{{ message }}</p>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST"
              action="{{ url_for('worker_add_service') }}">


            <div class="form-group">

                <label for="name">
                    Service Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Example: Home Cleaning"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Describe the service you provide"
                    required
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="price">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="500"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="Cleaning"
                        required
                    >

                </div>

            </div>


            <button type="submit"
                    class="add-button">

                Add Service

            </button>


            <a href="{{ url_for('worker_dashboard') }}"
               class="cancel-button">

                Cancel

            </a>

        </form>

    </div>

</main>


<footer>

    <p>
        © 2026 ServiceHub. All Rights Reserved.
    </p>

</footer>

</body>

</html>
